<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ellipse Time</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      margin: 0;
      background: #eeeeee;
      overflow: hidden;
    }

    body {
      width: min(100vw, 56.25vh);
      height: min(177.7778vw, 100vh);
      margin: 0;
      position: relative;
      overflow: hidden;
      background: linear-gradient(to bottom, #0014ff 0%, #5b63f4 48%, #d1d1d1 100%);
      font-family: Arial, Helvetica, sans-serif;
    }

    .star {
      position: absolute;
      color: white;
      font-size: 4vmin;
      line-height: 1;
      z-index: 20;
    }

    .star.small {
      font-size: 3vmin;
    }

    .star.tiny {
      font-size: 2.4vmin;
    }

.earth-orbit {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 54vmin;
  height: 12.5vmin;
  border: 0.16vmin solid rgba(255, 255, 255, 0.78);
  border-radius: 50%;
  transform: translate(-50%, -50%) rotate(28deg);
}

#orbit-back {
  clip-path: inset(0 0 50% 0);
  z-index: 1;
}

#orbit-front {
  clip-path: inset(50% 0 0 0);
  z-index: 4;
}

    .moon-orbit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12vmin;
      height: 2.6vmin;
      border: 0.1vmin solid rgba(255, 255, 255, 0.68);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-18deg);
    }

    #moon-orbit-back {
      clip-path: inset(0 0 50% 0);
    }

    #moon-orbit-front {
      clip-path: inset(50% 0 0 0);
    }

    .circle {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    #sun {
      width: 16vmin;
      height: 16vmin;
      z-index: 3;
      background: linear-gradient(to bottom, #ffe7d8 0%, #ffb07e 52%, #ff732d 100%);
      box-shadow: 0 2vmin 5vmin rgba(255, 115, 45, 0.22);
    }

    #earth {
  width: 4.8vmin;
  height: 4.8vmin;
  background: linear-gradient(to bottom, #ceffd8 0%, #86ff9d 52%, #52f36e 100%);
  box-shadow: 0 1vmin 2.6vmin rgba(82, 243, 110, 0.22);
}

    #moon {
      width: 2vmin;
      height: 2vmin;
      background: linear-gradient(to bottom, #ffd8ff 0%, #d686ff 52%, #b35bfa 100%);
      box-shadow: 0 0.8vmin 2vmin rgba(179, 91, 250, 0.22);
    }
  </style>
</head>

<body>
  <div class="star" style="left: 18%; top: 26%;">＊</div>
  <div class="star small" style="left: 35%; top: 18%;">＊</div>
  <div class="star tiny" style="left: 72%; top: 13%;">＊</div>
  <div class="star" style="left: 84%; top: 34%;">＊</div>
  <div class="star tiny" style="left: 59%; top: 39%;">＊</div>
  <div class="star small" style="left: 13%; top: 65%;">＊</div>
  <div class="star" style="left: 35%; top: 74%;">＊</div>
  <div class="star small" style="left: 84%; top: 73%;">＊</div>
  <div class="star tiny" style="left: 41%; top: 81%;">＊</div>

  <div id="orbit-back" class="earth-orbit"></div>
<div id="orbit-front" class="earth-orbit"></div>

  <div id="moon-orbit-back" class="moon-orbit"></div>
  <div id="moon-orbit-front" class="moon-orbit"></div>

  <div id="sun" class="circle"></div>
  <div id="earth" class="circle"></div>
  <div id="moon" class="circle"></div>

  <script>
    const earth = document.getElementById("earth");
const moon = document.getElementById("moon");
const orbitBack = document.getElementById("orbit-back");
const orbitFront = document.getElementById("orbit-front");
    const moonOrbitBack = document.getElementById("moon-orbit-back");
    const moonOrbitFront = document.getElementById("moon-orbit-front");

const earthOrbitWidth = 27;
const earthOrbitHeight = 6.25;
    const earthOrbitTilt = 28 * Math.PI / 180;

    const moonOrbitWidth = 6;
    const moonOrbitHeight = 1.3;
    const moonOrbitTilt = -18 * Math.PI / 180;

    function moveCircle(circle, x, y) {
      circle.style.transform =
        "translate(-50%, -50%) translate(" + x + "vmin, " + y + "vmin)";
    }

    function moveOrbit(orbit, x, y, tilt) {
      orbit.style.transform =
        "translate(-50%, -50%) translate(" + x + "vmin, " + y + "vmin) rotate(" + tilt + "deg)";
    }

    function rotatePoint(x, y, angle) {
      return {
        x: x * Math.cos(angle) - y * Math.sin(angle),
        y: x * Math.sin(angle) + y * Math.cos(angle)
      };
    }

    function updateScene() {
      const now = new Date();

      const minute = now.getMinutes();
      const second = now.getSeconds();

      const earthAngle = (minute * 6 - 90) * Math.PI / 180;
      const earthFlatX = Math.cos(earthAngle) * earthOrbitWidth;
      const earthFlatY = Math.sin(earthAngle) * earthOrbitHeight;
      const earthPosition = rotatePoint(earthFlatX, earthFlatY, earthOrbitTilt);

      const moonAngle = (second * 6 - 90) * Math.PI / 180;
      const moonFlatX = Math.cos(moonAngle) * moonOrbitWidth;
      const moonFlatY = Math.sin(moonAngle) * moonOrbitHeight;
      const moonOffset = rotatePoint(moonFlatX, moonFlatY, moonOrbitTilt);

      const moonX = earthPosition.x + moonOffset.x;
      const moonY = earthPosition.y + moonOffset.y;

      moveCircle(earth, earthPosition.x, earthPosition.y);
      moveCircle(moon, moonX, moonY);
      moveOrbit(moonOrbitBack, earthPosition.x, earthPosition.y, -18);
      moveOrbit(moonOrbitFront, earthPosition.x, earthPosition.y, -18);

if (earthFlatY < 0) {
  orbitBack.style.zIndex = "1";
  orbitFront.style.zIndex = "4";

  earth.style.zIndex = "1";

  moonOrbitBack.style.zIndex = "0";
  moonOrbitFront.style.zIndex = "2";

  if (moonFlatY < 0) {
    moon.style.zIndex = "0";
  } else {
    moon.style.zIndex = "3";
  }
} else {
  orbitBack.style.zIndex = "1";
  orbitFront.style.zIndex = "4";

  earth.style.zIndex = "5";

  moonOrbitBack.style.zIndex = "4";
  moonOrbitFront.style.zIndex = "6";

  if (moonFlatY < 0) {
    moon.style.zIndex = "4";
  } else {
    moon.style.zIndex = "7";
  }
}
    }

    updateScene();
    setInterval(updateScene, 100);
  </script>
</body>
</html>
