
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sun Earth Moon Time</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      margin: 0;
      background: #eeeeee;
      overflow: hidden;
    }

    body {
      width: min(100vw, 56.25vh);
      height: min(177.7778vw, 100vh);
      margin: 0;
      position: relative;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .circle {
      position: absolute;
      left: 50%;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    #sun {
      width: 12vmin;
      height: 12vmin;
      z-index: 1;
      box-shadow: 0 2vmin 5vmin rgba(255, 128, 54, 0.22);
    }

    #sun.orange {
      background: linear-gradient(to bottom, #ffe4d7 0%, #ffb286 48%, #ff7832 100%);
    }

    #sun.green {
      background: linear-gradient(to bottom, #d9ffd0 0%, #8bfb72 50%, #4af133 100%);
      box-shadow: 0 2vmin 5vmin rgba(84, 240, 58, 0.22);
    }

    #earth {
      width: 6vmin;
      height: 6vmin;
      z-index: 2;
      background: linear-gradient(to bottom, #d5eaff 0%, #76baff 48%, #1f87f2 100%);
      box-shadow: 0 1.2vmin 3vmin rgba(31, 135, 242, 0.2);
    }

    #moon {
      width: 3vmin;
      height: 3vmin;
      z-index: 3;
      background: linear-gradient(to bottom, #f1d2ff 0%, #d980f2 52%, #b95be8 100%);
      box-shadow: 0 0.8vmin 2vmin rgba(185, 91, 232, 0.22);
    }
  </style>
</head>

<body>
  <div id="sun" class="circle orange"></div>
  <div id="earth" class="circle"></div>
  <div id="moon" class="circle"></div>

  <script>
  const sun = document.getElementById("sun");
  const earth = document.getElementById("earth");
  const moon = document.getElementById("moon");

  const earthOrbit = 18;
  const moonOrbit = 6;

  function moveCircle(circle, x, y) {
    circle.style.transform =
      "translate(-50%, -50%) translate(" + x + "vmin, " + y + "vmin)";
  }

  function updateTimeScene() {
    const now = new Date();

    const hour = now.getHours();
    const minute = now.getMinutes();
    const second = now.getSeconds();

    const earthAngle = (minute * 6 - 90) * Math.PI / 180;
    const moonAngle = (second * 6 - 90) * Math.PI / 180;

    const earthX = Math.cos(earthAngle) * earthOrbit;
    const earthY = Math.sin(earthAngle) * earthOrbit;

    const moonX = earthX + Math.cos(moonAngle) * moonOrbit;
    const moonY = earthY + Math.sin(moonAngle) * moonOrbit;

    moveCircle(earth, earthX, earthY);
    moveCircle(moon, moonX, moonY);

    if (hour % 2 === 0) {
      sun.className = "circle orange";
    } else {
      sun.className = "circle green";
    }
  }

  updateTimeScene();
  setInterval(updateTimeScene, 100);
</script>
</body>
</html>
